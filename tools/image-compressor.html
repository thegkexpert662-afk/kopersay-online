<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Image Compressor Online Free | Kopersay</title><meta name="description" content="Compress JPG PNG and WebP images online with quality, target size and format controls."><link rel="stylesheet" href="style.css"><style>.toolgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:22px}.preview{min-height:300px;border:2px dashed #cdd8ea;border-radius:18px;display:flex;align-items:center;justify-content:center;background:#fff8}.preview img{max-width:100%;max-height:360px;border-radius:12px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.stat{padding:14px;border-radius:14px;background:#fff8}.stat b{display:block;font-size:20px}.range{width:100%}@media(max-width:700px){.toolgrid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Image Compressor</h1><p>Reduce image file size while keeping the quality you need.</p></section><section class="card"><div class="toolgrid"><div><div class="field"><label>Select image</label><input id="f" type="file" accept="image/*"></div><div class="preview"><span id="hint">Your preview will appear here</span><img id="img" hidden></div><div class="stats"><div class="stat">Original<b id="os">—</b></div><div class="stat">Compressed<b id="cs">—</b></div></div></div><div><div class="field"><label>Output format</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/webp">WebP</option><option value="image/png">PNG</option></select></div><div class="field"><label>Quality <b id="qv">80%</b></label><input class="range" id="q" type="range" min="10" max="100" value="80"></div><div class="field"><label>Target size (optional MB)</label><input id="target" type="number" min="0.01" step="0.01" placeholder="e.g. 1"></div><button class="btn" id="go">Compress & Download</button><div id="out" class="answer">Choose an image to begin.</div></div></div></section><footer>© 2026 Kopersay Technologies</footer></div><script src="workbench.js"></script><script>let im=new Image,file;f.onchange=()=>{file=f.files[0];if(!file)return;os.textContent=fmtBytes(file.size);im.onload=()=>{img.src=im.src;img.hidden=false;hint.hidden=true;out.textContent=`Original: ${im.width} × ${im.height}px`};im.src=URL.createObjectURL(file)};q.oninput=()=>qv.textContent=q.value+'%';go.onclick=()=>{if(!file)return out.textContent='Choose an image first.';let c=document.createElement('canvas');c.width=im.width;c.height=im.height;let x=c.getContext('2d');if(fmt.value==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0);c.toBlob(b=>{if(!b)return;cs.textContent=fmtBytes(b.size);let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kopersay-compressed.'+(fmt.value==='image/png'?'png':fmt.value==='image/webp'?'webp':'jpg');a.click();out.textContent=`Done • ${fmtBytes(b.size)} • ${Math.round((1-b.size/file.size)*100)}% size reduction`},fmt.value,+q.value/100)};function fmtBytes(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB'}</script></body></html>
