<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Image Compressor Online | JPG PNG WebP - Kopersay</title><meta name="description" content="Compress images online for free and reduce JPG, PNG or WebP file size. Choose quality and download a smaller image quickly."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay Technologies"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Free Image Compressor</h1><p>Reduce image file size while keeping useful quality. Processing happens in your browser.</p></section><section class="card"><div class="field"><label>Choose image</label><input id="file" type="file" accept="image/*"></div><div class="field"><label>Quality: <span id="qv">80%</span></label><input id="q" type="range" min="10" max="100" value="80"></div><button class="btn" id="go">Compress & Download</button><img id="preview" class="preview"><div id="out" class="result">Select an image to begin.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let f,im=new Image;q.oninput=()=>qv.textContent=q.value+'%';file.onchange=e=>{f=e.target.files[0];if(f){im.onload=()=>preview.src=im.src;im.src=URL.createObjectURL(f)}};go.onclick=()=>{if(!f)return out.textContent='Please choose an image first.';let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kopersay-compressed.jpg';a.click();out.textContent=`Original ${(f.size/1024).toFixed(1)} KB → Output ${(b.size/1024).toFixed(1)} KB`},'image/jpeg',q.value/100)}</script></body></html>
