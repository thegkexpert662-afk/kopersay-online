<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Image Size Calculator | Kopersay</title><meta name="description" content="Calculate image dimensions, aspect ratio, megapixels and file size estimates online."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Image Size Calculator</h1><p>Calculate pixels, aspect ratio and megapixels from your image dimensions.</p></section><section class="card"><div class="row"><div class="field"><label>Width (px)</label><input id="w" type="number" min="1" placeholder="1920"></div><div class="field"><label>Height (px)</label><input id="h" type="number" min="1" placeholder="1080"></div></div><div class="row"><div class="field"><label>Target width (optional)</label><input id="tw" type="number" min="1" placeholder="1080"></div><div class="field"><label>Target height (optional)</label><input id="th" type="number" min="1" placeholder="Auto from ratio"></div></div><button class="btn" onclick="calc()">Calculate</button><button class="btn" onclick="reset()" style="margin-left:8px">Reset</button><div id="out" class="answer">Enter dimensions.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function calc(){let a=+w.value,b=+h.value;if(!a||!b)return out.textContent='Enter valid dimensions.';let g=(x,y)=>{while(y){[x,y]=[y,x%y]}return x},d=g(a,b),r=(a/d)+':'+(b/d),mp=(a*b/1e6).toFixed(2);let resize=tw.value?(+tw.value+'/'+Math.round(+tw.value*b/a)+' px'):'Not set';out.textContent=`Dimensions: ${a} × ${b} px\nAspect Ratio: ${r}\nMegapixels: ${mp} MP\nEstimated resize: ${resize}`}function reset(){w.value=h.value=tw.value=th.value='';out.textContent='Enter dimensions.'}</script></body></html>
