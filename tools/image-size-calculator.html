<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Size Calculator Online | Kopersay</title><meta name="description" content="Calculate image pixels, megapixels, aspect ratio, orientation and print size online."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Image Size Calculator</h1><p>Get exact dimensions, megapixels, aspect ratio and print size.</p></section><section class="card"><div class="row"><div class="field"><label>Width (px)</label><input id="w" type="number" value="1920"></div><div class="field"><label>Height (px)</label><input id="h" type="number" value="1080"></div></div><div class="field"><label>DPI</label><input id="dpi" type="number" value="300"></div><button class="btn" onclick="calc()">Calculate</button><div id="out" class="answer"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function calc(){let W=+w.value,H=+h.value,D=+dpi.value,g=Math.gcd?Math.gcd(W,H):(()=>{let a=W,b=H;while(b){[a,b]=[b,a%b]}return a})();out.textContent=`Pixels: ${(W*H).toLocaleString()}\nMegapixels: ${(W*H/1e6).toFixed(2)} MP\nAspect Ratio: ${(W/g).toFixed(0)}:${(H/g).toFixed(0)}\nOrientation: ${W>H?'Landscape':W<H?'Portrait':'Square'}\nPrint Size: ${(W/D).toFixed(2)} × ${(H/D).toFixed(2)} inches`}</script></body></html>
