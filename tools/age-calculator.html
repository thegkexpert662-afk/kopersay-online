<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Age Calculator Online | Kopersay</title><meta name="description" content="Calculate exact age in years, months and days online for free."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Age Calculator</h1><p>Calculate exact age and days until your next birthday.</p></section><section class="card"><div class="row"><div class="field"><label>Date of birth</label><input id="dob" type="date"></div><div class="field"><label>Calculate up to</label><input id="to" type="date"></div></div><button class="btn" onclick="calc()">Calculate Age</button><div id="out" class="answer">Enter dates.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>const p=n=>String(n).padStart(2,'0'),D=s=>{let[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};let t=new Date();to.value=`${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())}`;function calc(){if(!dob.value)return out.textContent='Select date of birth.';let b=D(dob.value),e=D(to.value);if(b>e)return out.textContent='Birth date cannot be after calculation date.';let y=e.getFullYear()-b.getFullYear(),m=e.getMonth()-b.getMonth(),d=e.getDate()-b.getDate();if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}if(m<0){y--;m+=12}let days=Math.round((e-b)/86400000);let n=new Date(e.getFullYear(),b.getMonth(),b.getDate());if(n<e)n.setFullYear(e.getFullYear()+1);out.textContent=`Exact Age: ${y} years, ${m} months, ${d} days\nTotal Days: ${days.toLocaleString('en-IN')}\nNext Birthday: ${p(n.getDate())}/${p(n.getMonth()+1)}/${n.getFullYear()}\nDays Until: ${Math.round((n-e)/86400000)}`}</script></body></html>
