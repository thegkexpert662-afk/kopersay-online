<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Age Calculator Online | Kopersay</title><meta name="description" content="Calculate exact age in years months days total days and next birthday online."><link rel="stylesheet" href="style.css"><style>.big{font-size:30px;font-weight:900}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.chip{padding:15px;border-radius:14px;background:#fff8;text-align:center}@media(max-width:650px){.chips{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Age Calculator</h1><p>Find exact age, total days and your next birthday.</p></section><section class="card"><div class="row"><div class="field"><label>Date of birth</label><input id="dob" type="date"></div><div class="field"><label>Calculate as of</label><input id="to" type="date"></div></div><button class="btn" onclick="calc()">Calculate Exact Age</button><div id="out" class="answer">Enter your dates.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let n=new Date();to.value=n.toISOString().slice(0,10);function calc(){if(!dob.value)return out.textContent='Select date of birth.';let b=new Date(dob.value+'T00:00:00'),e=new Date(to.value+'T00:00:00');if(b>e)return out.textContent='Birth date cannot be after the calculation date.';let y=e.getFullYear()-b.getFullYear(),m=e.getMonth()-b.getMonth(),d=e.getDate()-b.getDate();if(d<0){m--;d+=new Date(e.getFullYear(),e.getMonth(),0).getDate()}if(m<0){y--;m+=12}let days=Math.floor((e-b)/864e5);let next=new Date(e.getFullYear(),b.getMonth(),b.getDate());if(next<=e)next.setFullYear(next.getFullYear()+1);out.innerHTML=`<div class="big">${y} years ${m} months ${d} days</div><div class="chips"><div class="chip"><b>Total Days</b><br>${days.toLocaleString('en-IN')}</div><div class="chip"><b>Next Birthday</b><br>${next.toLocaleDateString('en-IN')}</div><div class="chip"><b>Days Until</b><br>${Math.ceil((next-e)/864e5)}</div></div>`}</script></body></html>
