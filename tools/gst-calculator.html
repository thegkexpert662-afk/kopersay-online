<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced GST Calculator Online | Kopersay</title><meta name="description" content="Calculate GST inclusive and exclusive prices with CGST SGST and IGST breakdown."><link rel="stylesheet" href="style.css"><style>.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}.cards div{padding:15px;border-radius:14px;background:#fff8;text-align:center}.cards b{display:block;font-size:20px}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced GST Calculator</h1><p>Calculate GST, CGST, SGST and final invoice amount instantly.</p></section><section class="card"><div class="row"><div class="field"><label>Amount (₹)</label><input id="amt" type="number" min="0" step="0.01" placeholder="1000"></div><div class="field"><label>GST rate</label><select id="rate"><option>0</option><option>5</option><option>12</option><option selected>18</option><option>28</option></select></div></div><div class="field"><label>Calculation mode</label><select id="mode"><option value="add">Add GST to amount</option><option value="remove">Remove GST from inclusive amount</option></select></div><button class="btn" onclick="calc()">Calculate GST</button><div id="out" class="answer">Enter an amount.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script src="workbench.js"></script><script>function calc(){let a=+amt.value,r=+rate.value;if(!a||a<0)return out.textContent='Enter a valid amount.';if(mode.value==='add'){let g=a*r/100;out.innerHTML=`<div class="cards"><div>Base<b>₹${a.toFixed(2)}</b></div><div>CGST<b>₹${(g/2).toFixed(2)}</b></div><div>SGST<b>₹${(g/2).toFixed(2)}</b></div><div>Total<b>₹${(a+g).toFixed(2)}</b></div></div>`}else{let base=a/(1+r/100),g=a-base;out.innerHTML=`<div class="cards"><div>Base<b>₹${base.toFixed(2)}</b></div><div>GST<b>₹${g.toFixed(2)}</b></div><div>CGST<b>₹${(g/2).toFixed(2)}</b></div><div>SGST<b>₹${(g/2).toFixed(2)}</b></div></div>`}}</script></body></html>
