<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced GST Calculator India Online | Kopersay</title><meta name="description" content="Calculate GST inclusive and exclusive prices, GST amount, CGST and SGST online."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>GST Calculator</h1><p>Calculate GST inclusive and exclusive prices instantly.</p></section><section class="card"><div class="row"><div class="field"><label>Amount (₹)</label><input id="a" type="number" value="1000"></div><div class="field"><label>GST Rate %</label><select id="r"><option>0</option><option>5</option><option>12</option><option selected>18</option><option>28</option></select></div></div><button class="btn" onclick="calc()">Calculate</button><div id="out" class="answer"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function calc(){let a=+document.getElementById('a').value,r=+document.getElementById('r').value,g=a*r/100;out.textContent=`Exclusive Base: ₹${a.toFixed(2)}\nGST: ₹${g.toFixed(2)}\nCGST: ₹${(g/2).toFixed(2)}\nSGST: ₹${(g/2).toFixed(2)}\nInclusive Total: ₹${(a+g).toFixed(2)}`}calc()</script></body></html>
