gin:0}.hero-art{width:250px;height:190px;flex:0 0 250px;border-radius:32px;background:#ffffffa6;position:relative;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px #6a72ba18}.photo-card{width:105px;height:135px;border:8px solid #fff;border-radius:8px;background:linear-gradient(#d8ebff,#fff);box-shadow:0 10px 25px #6070a733;position:relative;z-index:2}.person-head{width:43px;height:49px;border-radius:48% 48% 45% 45%;background:#f4b38c;position:absolute;top:18px;left:23px}.hair{width:46px;height:25px;border-radius:50% 50% 20% 20%;background:#162a52;position:absolute;top:-4px;left:-2px}.person-body{position:absolute;width:70px;height:55px;left:10px;bottom:4px;background:#315eaa;border-radius:40px 40px 8px 8px}.back-photo{position:absolute;width:92px;height:122px;border:8px solid #fff;border-radius:8px;background:#e8f2ff;left:47px;transform:rotate(-7deg);opacity:.85}.back-photo.right{left:auto;right:47px;transform:rotate(7deg)}.crop-badge{position:absolute;right:23px;bottom:25px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#6845ee,#2449ee);display:grid;place-items:center;color:white;font-size:28px;z-index:3;box-shadow:0 8px 20px #3850c755}.card{padding:26px;border-radius:28px;background:#ffffffc9;backdrop-filter:blur(16px);box-shadow:0 20px 55px #4769a020}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}.field label{font-weight:600;font-size:16px}.field input,.field select{width:100%;height:48px;padding:0 14px;border:1px solid #e0e5ef;border-radius:12px;background:#fff;font:inherit;color:#17284c}.field input[type=color]{padding:5px}.primary{border:0;border-radius:14px;padding:14px 22px;background:linear-gradient(135deg,#6642ef,#12aee9);color:#fff;font-weight:800;font-size:15px;cursor:pointer;justify-self:start}.preview-wrap{margin-top:16px;padding:14px;border-radius:16px;background:#ffffff9a;display:flex;justify-content:c </style></head><body><div class="wrap"><header class="site-head"><img src="../logo.svg" alt="Kopersay Online"><div class="brand">Kopersay <span>Online</span></div><nav class="nav"><a href="../index.html">Home</a><a class="drop" href="index.html">All Tools</a><a class="drop" href="index.html">Images</a><a class="drop" href="index.html">Calculators</a><a class="drop" href="index.html">Converters</a><a class="drop" href="index.html">More</a></nav><div class="head-actions"><span class="icon-btn">◐</span><span class="icon-btn">⌕</span><a class="all-tools" href="index.html">All Tools</a></div></header><div class="browser-bar"><div class="browser-label">🔒 &nbsp;Runs in your browser</div><div class="browser-actions"><button type="button" onclick="saveTool()">☆ Save Tool</button><button type="button" onclick="shareTool()">↗ Share</button><button type="button" onclick="resetTool()">↻ Reset</button></div></div><section class="hero"><div class="hero-copy"><div class="badge"><b>▣</b> Passport Tool</div><h1>Advanced Passport Photo Maker</h1><p>Prepare a passport-style photo with custom size and background.</p></div><div class="hero-art"><div class="back-photo"></div><div class="back-photo right"></div><div class="photo-card"><div class="person-head"><i class="hair"></i></div><div class="person-body"></div></div><div class="crop-badge">⌗</div></div></section><section class="card"><div class="form-grid"><div class="field full"><label for="f">Upload photo</label><input id="f" type="file" accept="image/*"></div><div class="field"><label for="w">Photo width (mm)</label><input id="w" type="number" value="35" min="10"></div><div class="field"><label for="h">Photo height (mm)</label><input id="h" type="number" value="45" min="10"></div><div class="field"><label for="bg">Background</label><input id="bg" type="color" value="#ffffff"></div><div class="field"><label for="copies">Print copies</label><select id="copies"><option>1</option><option selected>4</option><option>6</option><option>8</option><option>12</option></select></div></div><button class="primary" style="margin-top:16px" onclick="make()">Create Photo Sheet</button><div class="preview-wrap"><div class="preview"><canvas id="c" width="700" height="900"></canvas></div></div><button id="downloadBtn" class="primary download" onclick="download()" disabled>↓ Download PNG</button><div id="out" class="answer">Upload a photo to begin.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let im=new Image,hasImage=false;const $=id=>document.getElementById(id);f.onchange=()=>{if(f.files[0]){im.onload=()=>{hasImage=true;make()};im.src=URL.createObjectURL(f.files[0])}};function make(){if(!im.naturalWidth)return;let W=Math.max(200,+w.value*20),H=Math.max(200,+h.value*20),n=+copies.value,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),c=$("c");c.width=cols*W;c.height=rows*H;let x=c.getContext('2d');x.fillStyle=bg.value;x.fillRect(0,0,c.width,c.height);for(let i=0;i<n;i++){let cx=(i%cols)*W,cy=Math.floor(i/cols)*H,sc=Math.min(W/im.width,H/im.height),iw=im.width*sc,ih=im.height*sc;x.drawImage(im,cx+(W-iw)/2,cy+(H-ih)/2,iw,ih)}$('out').textContent=`Created ${n} copies • ${w.value} × ${h.value} mm`;$("downloadBtn").disabled=false}function download(){if(!hasImage)return;let a=document.createElement('a');a.href=$("c").toDataURL('image/png');a.download='kopersay-passport-photo-sheet.png';a.click()}function resetTool(){location.reload()}function saveTool(){localStorage.setItem('kopersay-passport-tool','saved');$('out').textContent='Tool saved on this device.'}async function shareTool(){try{await navigator.clipboard.writeText(location.href);$('out').textContent='Tool link copied to clipboard.'}catch(e){$('out').textContent=location.href}}</script></body></html>
