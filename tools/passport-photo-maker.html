<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Passport Photo Maker Online | Kopersay</title><meta name="description" content="Create passport-size photos with custom dimensions, background and print sheet options."><link rel="stylesheet" href="style.css"><style>.preview{display:flex;justify-content:center;padding:20px;background:#fff8;border-radius:18px}.preview canvas{max-width:100%;height:auto;background:white;box-shadow:0 8px 25px #0002}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Passport Photo Maker</h1><p>Prepare a passport-style photo with custom size and background.</p></section><section class="card"><div class="field"><label>Upload photo</label><input id="f" type="file" accept="image/*"></div><div class="row"><div class="field"><label>Photo width (mm)</label><input id="w" type="number" value="35" min="10"></div><div class="field"><label>Photo height (mm)</label><input id="h" type="number" value="45" min="10"></div></div><div class="row"><div class="field"><label>Background</label><input id="bg" type="color" value="#ffffff"></div><div class="field"><label>Print copies</label><select id="copies"><option>1</option><option selected>4</option><option>6</option><option>8</option><option>12</option></select></div></div><button class="btn" onclick="make()">Create Photo Sheet</button><div class="preview"><canvas id="c" width="700" height="900"></canvas></div><button class="btn" onclick="download()">Download PNG</button><div id="out" class="answer">Upload a photo to begin.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let im=new Image;f.onchange=()=>{if(f.files[0]){im.onload=make;im.src=URL.createObjectURL(f.files[0])}};function make(){if(!im.naturalWidth)return;let W=+w.value*20,H=+h.value*20,n=+copies.value,cols=Math.ceil(Math.sqrt(n)),rows=Math.ceil(n/cols),c=document.getElementById('c');c.width=cols*W;c.height=rows*H;let x=c.getContext('2d');x.fillStyle=bg.value;x.fillRect(0,0,c.width,c.height);for(let i=0;i<n;i++){let cx=(i%cols)*W,cy=Math.floor(i/cols)*H,sc=Math.min(W/im.width,H/im.height);let iw=im.width*sc,ih=im.height*sc;x.drawImage(im,cx+(W-iw)/2,cy+(H-ih)/2,iw,ih)}out.textContent=`Created ${n} copies • ${w.value} × ${h.value} mm`}function download(){let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='kopersay-passport-photo-sheet.png';a.click()}</script></body></html>
