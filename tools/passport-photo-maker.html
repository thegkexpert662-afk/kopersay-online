<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passport Photo Maker Online Free | Kopersay</title><meta name="description" content="Create passport and ID photo crops online with standard sizes and JPG download."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Passport Photo Maker</h1><p>Create a standard passport-style photo crop in your browser.</p></section><section class="card"><div class="field"><label>Photo</label><input id="f" type="file" accept="image/*"></div><div class="row"><div class="field"><label>Size</label><select id="sz"><option value="35x45">35 × 45 mm</option><option value="50.8x50.8">2 × 2 inch</option><option value="25x35">25 × 35 mm</option></select></div><div class="field"><label>DPI</label><select id="dpi"><option>300</option><option>600</option><option>150</option></select></div></div><button class="btn" onclick="go()">Create & Download JPG</button><div id="out" class="answer">Select a photo.</div><canvas id="c" style="max-width:100%;margin-top:15px"></canvas></section><footer>© 2026 Kopersay Technologies</footer></div><script>function go(){let file=f.files[0];if(!file)return out.textContent='Select a photo.';let im=new Image,u=URL.createObjectURL(file);im.onload=()=>{let [w,h]=sz.value.split('x').map(Number),d=+dpi.value,W=Math.round(w*d/25.4),H=Math.round(h*d/25.4),can=document.getElementById('c');can.width=W;can.height=H;let x=can.getContext('2d'),s=Math.max(W/im.width,H/im.height),iw=im.width*s,ih=im.height*s;x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,(W-iw)/2,(H-ih)/2,iw,ih);let a=document.createElement('a');a.href=can.toDataURL('image/jpeg',.95);a.download='kopersay-passport-photo.jpg';a.click();out.textContent=`Output: ${W} × ${H} px`};im.src=u}</script></body></html>
