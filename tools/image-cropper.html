<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Image Cropper Online | Kopersay</title><meta name="description" content="Crop JPG PNG and WebP images online with aspect ratio presets and output controls."><link rel="stylesheet" href="style.css"><style>.preview{max-height:420px;overflow:hidden;border-radius:18px;background:#fff8;text-align:center}.preview img{max-width:100%;max-height:420px}.presets{display:flex;gap:8px;flex-wrap:wrap}.presets button{border:0;border-radius:10px;padding:9px 13px;cursor:pointer}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Image Cropper</h1><p>Choose a crop ratio, set coordinates and export your cropped image.</p></section><section class="card"><div class="field"><label>Image</label><input id="f" type="file" accept="image/*"></div><div class="preview"><img id="im" hidden></div><div class="presets"><button onclick="ratio(1)">1:1 Square</button><button onclick="ratio(16/9)">16:9</button><button onclick="ratio(4/3)">4:3</button><button onclick="ratio(3/4)">3:4</button><button onclick="ratio(9/16)">9:16</button></div><div class="row"><div class="field"><label>Crop width</label><input id="w" type="number" min="1"></div><div class="field"><label>Crop height</label><input id="h" type="number" min="1"></div></div><div class="row"><div class="field"><label>Left (px)</label><input id="x" type="number" min="0" value="0"></div><div class="field"><label>Top (px)</label><input id="y" type="number" min="0" value="0"></div></div><div class="field"><label>Output format</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><button class="btn" onclick="go()">Crop & Download</button><div id="out" class="answer">Choose an image.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let src=new Image;f.onchange=()=>{src.onload=()=>{im.src=src.src;im.hidden=false;w.value=src.width;h.value=src.height;out.textContent=`Image: ${src.width} × ${src.height}px`};src.src=URL.createObjectURL(f.files[0])};function ratio(r){if(!src.naturalWidth)return;w.value=Math.min(src.width,Math.round(src.height*r));h.value=Math.round(w.value/r)}function go(){if(!src.naturalWidth)return out.textContent='Choose an image first.';let W=Math.min(+w.value,src.width),H=Math.min(+h.value,src.height),X=Math.max(0,Math.min(+x.value,src.width-W)),Y=Math.max(0,Math.min(+y.value,src.height-H)),c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(src,X,Y,W,H,0,0,W,H);c.toBlob(b=>{let e=fmt.value.split('/')[1],a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kopersay-cropped.'+e;a.click();out.textContent=`Cropped: ${W} × ${H}px`},fmt.value,.92)}</script></body></html>
