<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Cropper Online Free | Kopersay</title><meta name="description" content="Crop images online with common aspect ratios and download PNG."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Image Cropper</h1><p>Crop an image to a custom rectangle or common ratio.</p></section><section class="card"><div class="field"><input id="f" type="file" accept="image/*"></div><div class="field"><label>Aspect ratio</label><select id="ratio"><option value="free">Free</option><option value="1">1:1</option><option value="1.7778">16:9</option><option value="1.3333">4:3</option><option value="0.8">4:5</option><option value="0.5625">9:16</option></select></div><button class="btn" onclick="crop()">Crop & Download</button><div id="out" class="answer">Select an image.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function crop(){let file=f.files[0];if(!file)return out.textContent='Select an image.';let im=new Image,u=URL.createObjectURL(file);im.onload=()=>{let r=ratio.value==='free'?im.width/im.height:+ratio.value,w=im.width,h=Math.round(w/r);if(h>im.height){h=im.height;w=Math.round(h*r)}let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,(im.width-w)/2,(im.height-h)/2,w,h,0,0,w,h);let a=document.createElement('a');a.href=c.toDataURL('image/png');a.download='kopersay-cropped.png';a.click();out.textContent=`Crop: ${w} × ${h} px`};im.src=u}</script></body></html>
