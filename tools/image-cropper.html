<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Advanced Image Cropper Online | Crop JPG PNG WebP - Kopersay</title><meta name="description" content="Advanced free image cropper by Kopersay. Crop JPG, PNG and WebP images with aspect ratio presets, custom crop area, preview and instant browser download."><link rel="stylesheet" href="style.css"><style>.cropbox{position:relative;max-width:100%;margin:16px auto;background:rgba(0,0,0,.08);border-radius:16px;overflow:hidden}.cropbox canvas{display:block;max-width:100%;width:100%;height:auto;cursor:crosshair}.cropinfo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}.cropinfo div{padding:10px;border-radius:12px;background:rgba(255,255,255,.55);text-align:center}.cropinfo small{display:block;opacity:.7}.presets{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.presets button{border:1px solid rgba(80,100,180,.2);background:rgba(255,255,255,.72);border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:600}.range-line{display:flex;gap:10px;align-items:center}.range-line input{flex:1}@media(max-width:650px){.cropinfo{grid-template-columns:1fr}.presets{gap:6px}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay Technologies"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Free Advanced Image Cropper Online</h1><p>Crop JPG, PNG and WebP images precisely with a live preview, aspect-ratio presets and instant download.</p></section><section class="card"><div class="field"><label for="file">Choose or drop an image</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*"></div><div class="field"><label>Crop ratio</label><div class="presets"><button type="button" data-r="free">Free</button><button type="button" data-r="1">1:1</button><button type="button" data-r="1.7777778">16:9</button><button type="button" data-r="1.3333333">4:3</button><button type="button" data-r="0.8">4:5</button><button type="button" data-r="0.5625">9:16</button></div></div><div class="cropbox"><canvas id="canvas"></canvas></div><div class="cropinfo"><div><small>Image</small><strong id="imgInfo">—</strong></div><div><small>Crop</small><strong id="cropInfo">—</strong></div><div><small>Zoom</small><strong id="zoomInfo">100%</strong></div></div><div class="field"><label for="zoom">Zoom</label><div class="range-line"><input id="zoom" type="range" min="100" max="300" value="100"><strong id="zoomVal">100%</strong></div></div><div class="tools"><button class="btn" id="crop">Crop & Download</button><button class="btn" id="reset" type="button">Reset</button></div><div id="out" class="result">Select an image to begin.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>const file=document.getElementById('file'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),cropBtn=document.getElementById('crop'),reset=document.getElementById('reset'),out=document.getElementById('out'),zoom=document.getElementById('zoom'),zoomVal=document.getElementById('zoomVal'),zoomInfo=document.getElementById('zoomInfo'),imgInfo=document.getElementById('imgInfo'),cropInfo=document.getElementById('cropInfo');let img=new Image(),srcFile=null,ratio=null,z=1,crop={x:0,y:0,w:0,h:0},drag=false,sx=0,sy=0;function fitCrop(){if(!img.naturalWidth)return;let iw=img.naturalWidth,ih=img.naturalHeight;let cw=iw*.7,ch=ih*.7;if(ratio){if(cw/ch>ratio)cw=ch*ratio;else ch=cw/ratio}crop={x:(iw-cw)/2,y:(ih-ch)/2,w:cw,h:ch};draw()}function draw(){if(!img.naturalWidth)return;const max=900,scale=Math.min(1,max/img.naturalWidth);canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);const s=canvas.width/img.naturalWidth;ctx.save();ctx.fillStyle='rgba(0,0,0,.45)';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.clearRect(crop.x*s,crop.y*s,crop.w*s,crop.h*s);ctx.drawImage(img,crop.x,crop.y,crop.w,crop.h,crop.x*s,crop.y*s,crop.w*s,crop.h*s);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(crop.x*s,crop.y*s,crop.w*s,crop.h*s);ctx.restore();cropInfo.textContent=Math.round(crop.w)+' × '+Math.round(crop.h)+' px'}function pointer(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(canvas.width/img.naturalWidth?img.naturalWidth/canvas.width:1),y:(e.clientY-r.top)*(img.naturalHeight/canvas.height)} }file.onchange=e=>{srcFile=e.target.files[0];if(!srcFile||!srcFile.type.startsWith('image/'))return;img.onload=()=>{imgInfo.textContent=img.naturalWidth+' × '+img.naturalHeight+' px';z=1;zoom.value=100;zoomVal.textContent='100%';zoomInfo.textContent='100%';fitCrop();out.textContent='Drag inside the image to choose your crop area.'};img.src=URL.createObjectURL(srcFile)};canvas.addEventListener('pointerdown',e=>{if(!img.naturalWidth)return;drag=true;const p=pointer(e);sx=p.x;sy=p.y;canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag||!img.naturalWidth)return;const p=pointer(e);let x=Math.max(0,Math.min(sx,p.x)),y=Math.max(0,Math.min(sy,p.y)),w=Math.abs(p.x-sx),h=Math.abs(p.y-sy);if(ratio){if(w/h>ratio)w=h*ratio;else h=w/ratio}if(sx>p.x)x=sx-w;if(sy>p.y)y=sy-h;if(x+w>img.naturalWidth)w=img.naturalWidth-x;if(y+h>img.naturalHeight)h=img.naturalHeight-y;if(w>2&&h>2)crop={x,y,w,h};draw()});canvas.addEventListener('pointerup',()=>drag=false);zoom.oninput=()=>{zoomVal.textContent=zoom.value+'%';zoomInfo.textContent=zoom.value+'%';z=zoom.value/100;draw()};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{ratio=b.dataset.r==='free'?null:Number(b.dataset.r);fitCrop()});cropBtn.onclick=()=>{if(!srcFile||!img.naturalWidth){out.textContent='Please choose an image first.';return}const c=document.createElement('canvas');c.width=Math.round(crop.w);c.height=Math.round(crop.h);c.getContext('2d').drawImage(img,crop.x,crop.y,crop.w,crop.h,0,0,c.width,c.height);c.toBlob(blob=>{if(!blob)return;const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='kopersay-cropped.png';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);out.textContent='Done: '+c.width+' × '+c.height+' px • '+(blob.size/1024).toFixed(1)+' KB'},'image/png')};reset.onclick=()=>{file.value='';srcFile=null;ctx.clearRect(0,0,canvas.width,canvas.height);imgInfo.textContent='—';cropInfo.textContent='—';out.textContent='Select an image to begin.'}</script></body></html>
