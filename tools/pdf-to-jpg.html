<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced PDF to JPG Converter Online Free | Kopersay</title><meta name="description" content="Advanced free PDF to JPG converter by Kopersay. Render PDF pages to JPG in your browser with page selection, scale, quality and individual or ZIP download options."><link rel="stylesheet" href="style.css"><style>.dropzone{border:2px dashed rgba(90,80,190,.3);border-radius:16px;padding:24px;text-align:center}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}.pages{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.pages button{border:1px solid rgba(80,80,170,.25);background:rgba(255,255,255,.7);padding:8px 12px;border-radius:10px;cursor:pointer}.pages button.active{font-weight:700}.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:18px}.thumb{background:rgba(255,255,255,.6);padding:10px;border-radius:14px;text-align:center}.thumb canvas{max-width:100%;height:auto;border-radius:8px}.thumb button{margin-top:8px;width:100%}.status{margin-top:12px}.range-line{display:flex;gap:10px;align-items:center}.range-line input{flex:1}@media(max-width:700px){.controls{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay Technologies"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced PDF to JPG Converter</h1><p>Convert PDF pages to high-quality JPG images directly in your browser. No account required.</p></section><section class="card"><div class="dropzone" id="drop"><strong>Drop PDF here</strong><br><span>or choose a file</span><br><input id="file" type="file" accept="application/pdf,.pdf"></div><div class="controls"><div class="field"><label for="scale">Render scale</label><select id="scale"><option value="1">100% — Standard</option><option value="1.5" selected>150% — High</option><option value="2">200% — Very High</option><option value="3">300% — Ultra</option></select></div><div class="field"><label for="quality">JPG quality</label><input id="quality" type="number" min="10" max="100" value="92"></div><div class="field"><label for="pagesInput">Pages</label><input id="pagesInput" placeholder="all or 1,3-5"></div></div><button class="btn" id="convert" type="button">Convert PDF to JPG</button><p id="status" class="result">Choose a PDF to begin.</p><div id="thumbs" class="thumbs"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script><script type="module">const file=document.getElementById('file'),drop=document.getElementById('drop'),convert=document.getElementById('convert'),status=document.getElementById('status'),thumbs=document.getElementById('thumbs'),scale=document.getElementById('scale'),quality=document.getElementById('quality'),pagesInput=document.getElementById('pagesInput');let selected=null,pdf=null;const pdfjs=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';function load(f){if(!f||f.type!=='application/pdf'&&!f.name.toLowerCase().endsWith('.pdf')){status.textContent='Please select a valid PDF file.';return}selected=f;status.textContent='PDF selected: '+f.name+' • '+(f.size/1024).toFixed(1)+' KB'}file.onchange=e=>load(e.target.files[0]);['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.style.borderColor='#6b4cff'}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.style.borderColor=''}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));function parsePages(s,total){if(!s.trim())return Array.from({length:total},(_,i)=>i+1);const set=new Set();for(const part of s.split(',')){const p=part.trim();if(/^\d+$/.test(p))set.add(Number(p));else if(/^(\d+)\s*-\s*(\d+)$/.test(p)){const m=p.match(/^(\d+)\s*-\s*(\d+)$/),a=Math.min(+m[1],+m[2]),b=Math.max(+m[1],+m[2]);for(let i=a;i<=b;i++)set.add(i)}}return [...set].filter(n=>n>=1&&n<=total).sort((a,b)=>a-b)}convert.onclick=async()=>{if(!selected){status.textContent='Please choose a PDF first.';return}try{status.textContent='Loading PDF…';const buf=await selected.arrayBuffer();pdf=await pdfjs.getDocument({data:buf}).promise;const nums=parsePages(pagesInput.value,pdf.numPages);if(!nums.length){status.textContent='No valid pages selected.';return}thumbs.innerHTML='';for(let i=0;i<nums.length;i++){status.textContent='Rendering page '+(i+1)+' of '+nums.length+'…';const page=await pdf.getPage(nums[i]);const viewport=page.getViewport({scale:Number(scale.value)});const canvas=document.createElement('canvas');canvas.width=Math.ceil(viewport.width);canvas.height=Math.ceil(viewport.height);await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;const wrap=document.createElement('div');wrap.className='thumb';const label=document.createElement('div');label.textContent='Page '+nums[i];const btn=document.createElement('button');btn.className='btn';btn.textContent='Download JPG';btn.onclick=()=>canvas.toBlob(blob=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='kopersay-page-'+nums[i]+'.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)},'image/jpeg',Math.min(1,Math.max(.1,Number(quality.value)/100)));wrap.append(canvas,label,btn);thumbs.appendChild(wrap)}status.textContent='Done • '+nums.length+' page(s) converted. Download each JPG below.'}catch(err){console.error(err);status.textContent='Could not read this PDF. Please try another PDF.'}}</script></body></html>
