<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Color Picker Online | Kopersay</title><meta name="description" content="Pick colors and get HEX RGB HSL and CSS color values online for free."><link rel="stylesheet" href="style.css"><style>.swatch{height:170px;border-radius:22px;border:1px solid #fff;box-shadow:0 15px 35px #25649620;margin-bottom:18px}.values{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.copy{cursor:pointer}@media(max-width:650px){.values{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Color Picker</h1><p>Choose a color and instantly get HEX, RGB, HSL and CSS values.</p></section><section class="card"><div id="sw" class="swatch"></div><div class="field"><label>Pick a color</label><input id="c" type="color" value="#6845ee"></div><div class="values"><div class="stat"><b>HEX</b><span id="hex">#6845EE</span></div><div class="stat"><b>RGB</b><span id="rgb"></span></div><div class="stat"><b>HSL</b><span id="hsl"></span></div><div class="stat"><b>CSS</b><span id="css"></span></div></div><button class="btn copy" onclick="copy()">Copy HEX</button><div id="out" class="answer">Select a color.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function render(){let v=c.value;sw.style.background=v;hex.textContent=v.toUpperCase();let n=parseInt(v.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;rgb.textContent=`rgb(${r}, ${g}, ${b})`;let R=r/255,G=g/255,B=b/255,max=Math.max(R,G,B),min=Math.min(R,G,B),l=(max+min)/2,s=max===min?0:(max-min)/(1-Math.abs(2*l-1));let h=0;if(max!==min){if(max===R)h=60*((G-B)/(max-min)%6);else if(max===G)h=60*((B-R)/(max-min)+2);else h=60*((R-G)/(max-min)+4)}if(h<0)h+=360;hsl.textContent=`hsl(${Math.round(h)}, ${Math.round(s*100)}%, ${Math.round(l*100)}%)`;css.textContent=`color: ${v};`}c.oninput=render;function copy(){navigator.clipboard?.writeText(c.value);out.textContent='HEX copied to clipboard.'}render()</script></body></html>
