<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Color Picker Online Free | HEX RGB HSL - Kopersay</title><meta name="description" content="Use Kopersay's free advanced color picker to choose colors and get HEX, RGB, HSL, HSV and CMYK values. Copy color codes instantly and generate shades and tints."><link rel="stylesheet" href="style.css"><style>.color-preview{height:170px;border-radius:18px;border:2px solid rgba(255,255,255,.7);box-shadow:0 12px 30px rgba(0,0,0,.15);margin:10px 0 18px}.values{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.value{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.6);padding:10px;border-radius:12px}.value code{flex:1;overflow:hidden;text-overflow:ellipsis}.copy{padding:7px 10px;border:0;border-radius:8px;cursor:pointer;background:#fff}.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.swatch{height:55px;border-radius:10px;border:1px solid rgba(0,0,0,.12);cursor:pointer}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.values,.fields{grid-template-columns:1fr}.palette{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay Technologies"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Color Picker</h1><p>Pick a color and instantly get HEX, RGB, HSL, HSV and CMYK values.</p></section><section class="card"><div class="fields"><div class="box"><label>Select color</label><input id="color" type="color" value="#6c5ce7" style="width:100%;height:70px;margin-top:8px"><div id="preview" class="color-preview"></div><div class="field"><label>HEX</label><input id="hex" value="#6c5ce7" maxlength="7"></div><button class="btn" id="apply">Apply HEX</button></div><div class="box"><h2>Color Values</h2><div class="values"><div class="value"><strong>HEX</strong><code id="vhex">#6c5ce7</code><button class="copy" data-copy="vhex">Copy</button></div><div class="value"><strong>RGB</strong><code id="vrgb"></code><button class="copy" data-copy="vrgb">Copy</button></div><div class="value"><strong>HSL</strong><code id="vhsl"></code><button class="copy" data-copy="vhsl">Copy</button></div><div class="value"><strong>HSV</strong><code id="vhsv"></code><button class="copy" data-copy="vhsv">Copy</button></div><div class="value"><strong>CMYK</strong><code id="vcmyk"></code><button class="copy" data-copy="vcmyk">Copy</button></div></div><button class="btn" id="copyAll" style="margin-top:12px">Copy All Values</button></div></div><div class="box" style="margin-top:18px"><h2>Shades & Tints</h2><div id="palette" class="palette"></div><p class="mini">Click any shade or tint to select it.</p></div><div class="actions"><button class="btn" id="random">Random Color</button><button class="btn" id="reset">Reset</button></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>const $=id=>document.getElementById(id);function clamp(n){return Math.max(0,Math.min(255,n))}function hexToRgb(h){h=h.replace('#','').trim();if(h.length===3)h=h.split('').map(x=>x+x).join('');if(!/^[0-9a-fA-F]{6}$/.test(h))return null;return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}function rgbToHsl(r,g,b){r/=255;g/=255;b/=255;let max=Math.max(r,g,b),min=Math.min(r,g,b),h,s,l=(max+min)/2,d=max-min;if(!d)h=s=0;else{s=l>.5?d/(2-max-min):d/(max+min);switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h*=60}return [Math.round(h),Math.round(s*100),Math.round(l*100)]}function rgbToHsv(r,g,b){let max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min,h=0,s=max?d/max:0,v=max/255;if(d){switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;default:h=(r-g)/d+4}h*=60}return [Math.round(h),Math.round(s*100),Math.round(v*100)]}function rgbToCmyk(r,g,b){let rr=r/255,gg=g/255,bb=b/255,k=1-Math.max(rr,gg,bb);if(k>=.999)return [0,0,0,100];return [Math.round((1-rr-k)/(1-k)*100),Math.round((1-gg-k)/(1-k)*100),Math.round((1-bb-k)/(1-k)*100),Math.round(k*100)]}function render(h){const rgb=hexToRgb(h);if(!rgb)return;$('color').value='#'+h.replace('#','').toLowerCase();$('hex').value=$('color').value;$('preview').style.background=$('color').value;$('vhex').textContent=$('color').value;const [r,g,b]=rgb;$('vrgb').textContent=`rgb(${r}, ${g}, ${b})`;const hsl=rgbToHsl(r,g,b),hsv=rgbToHsv(r,g,b),cmyk=rgbToCmyk(r,g,b);$('vhsl').textContent=`hsl(${hsl[0]}, ${hsl[1]}%, ${hsl[2]}%)`;$('vhsv').textContent=`hsv(${hsv[0]}, ${hsv[1]}%, ${hsv[2]}%)`;$('vcmyk').textContent=`cmyk(${cmyk.join('%, ')}%)`;makePalette(rgb)}function makePalette(rgb){const [r,g,b]=rgb,arr=[];for(let i=5;i>=1;i--){const f=i/6;arr.push([Math.round(255-(255-r)*f),Math.round(255-(255-g)*f),Math.round(255-(255-b)*f)])}arr.push(rgb);for(let i=1;i<=5;i++){const f=i/6;arr.push([Math.round(r*(1-f)),Math.round(g*(1-f)),Math.round(b*(1-f))])}$('palette').innerHTML=arr.map(x=>{const h='#'+x.map(n=>n.toString(16).padStart(2,'0')).join('');return `<button class="swatch" title="${h}" style="background:${h}" data-color="${h}"></button>`}).join('');document.querySelectorAll('.swatch').forEach(s=>s.onclick=()=>render(s.dataset.color))}function allText(){return `HEX: ${$('vhex').textContent}\nRGB: ${$('vrgb').textContent}\nHSL: ${$('vhsl').textContent}\nHSV: ${$('vhsv').textContent}\nCMYK: ${$('vcmyk').textContent}`}$('color').oninput=e=>render(e.target.value);$('apply').onclick=()=>{const v=$('hex').value.trim();if(hexToRgb(v))render(v);else alert('Please enter a valid HEX color.')};document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText($(b.dataset.copy).textContent);b.textContent='Copied';setTimeout(()=>b.textContent='Copy',900)});$('copyAll').onclick=async()=>{await navigator.clipboard.writeText(allText());$('copyAll').textContent='Copied All';setTimeout(()=>$('copyAll').textContent='Copy All Values',900)};$('random').onclick=()=>render('#'+Math.floor(Math.random()*16777216).toString(16).padStart(6,'0'));$('reset').onclick=()=>render('#6c5ce7');render('#6c5ce7');</script></body></html>
