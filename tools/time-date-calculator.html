<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Time and Date Calculator Online | Kopersay</title><meta name="description" content="Calculate date differences and add or subtract days hours and minutes online."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Time & Date Calculator</h1><p>Compare dates, calculate duration, and add or subtract time.</p></section><section class="card"><h3>Date Difference</h3><div class="row"><div class="field"><label>Start</label><input id="a" type="datetime-local"></div><div class="field"><label>End</label><input id="b" type="datetime-local"></div></div><button class="btn" onclick="diff()">Calculate Difference</button><div id="out" class="answer"></div><hr><h3>Add / Subtract Time</h3><div class="row"><div class="field"><label>Days</label><input id="d" type="number" value="0"></div><div class="field"><label>Hours</label><input id="h" type="number" value="0"></div></div><div class="row"><div class="field"><label>Minutes</label><input id="m" type="number" value="0"></div><div class="field"><label>Operation</label><select id="op"><option value="1">Add</option><option value="-1">Subtract</option></select></div></div><button class="btn" onclick="add()">Calculate New Date</button><div id="out2" class="answer"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function local(d){let z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,16)}let n=new Date();a.value=local(n);b.value=local(new Date(n.getTime()+864e5));function diff(){let x=new Date(a.value),y=new Date(b.value),ms=Math.abs(y-x),days=Math.floor(ms/864e5),hours=Math.floor(ms/36e5)%24,mins=Math.floor(ms/6e4)%60;out.textContent=`Duration: ${days} days, ${hours} hours, ${mins} minutes\nTotal hours: ${(ms/36e5).toFixed(2)}\nTotal minutes: ${Math.floor(ms/6e4)}`}function add(){let x=new Date(a.value),ms=((+d.value||0)*864e5+(+h.value||0)*36e5+(+m.value||0)*6e4)*(+op.value);x=new Date(x.getTime()+ms);out2.textContent='Result: '+x.toLocaleString('en-IN',{dateStyle:'full',timeStyle:'short'})}</script></body></html>
