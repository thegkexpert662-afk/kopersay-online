<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Percentage Calculator Online | Kopersay</title><meta name="description" content="Calculate percentages, percentage change, increase and decrease online."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Percentage Calculator</h1><p>Calculate percentage, change, increase and decrease.</p></section><section class="card"><div class="field"><label>Calculator type</label><select id="type"><option value="of">What is X% of Y?</option><option value="change">Percentage change</option><option value="increase">Increase Y by X%</option><option value="decrease">Decrease Y by X%</option></select></div><div class="row"><div class="field"><label>X / Original</label><input id="x" type="number" step="any" placeholder="25"></div><div class="field"><label>Y / New</label><input id="y" type="number" step="any" placeholder="200"></div></div><button class="btn" onclick="calc()">Calculate Percentage</button><div id="out" class="answer">Enter values.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script src="workbench.js"></script><script>function calc(){let a=+x.value,b=+y.value;if(!Number.isFinite(a)||!Number.isFinite(b))return out.textContent='Enter valid numbers.';let v=type.value;if(v==='of')out.textContent=`${a}% of ${b} = ${(a*b/100).toFixed(4)}`;if(v==='change'){if(b===0)return out.textContent='Original value cannot be zero.';out.textContent=`Percentage change = ${((a-b)/b*100).toFixed(2)}%`}if(v==='increase')out.textContent=`Result = ${(b*(1+a/100)).toFixed(4)}\nIncrease = ${(b*a/100).toFixed(4)}`;if(v==='decrease')out.textContent=`Result = ${(b*(1-a/100)).toFixed(4)}\nDecrease = ${(b*a/100).toFixed(4)}`}</script></body></html>
