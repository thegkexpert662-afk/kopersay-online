<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Percentage Calculator Online | Kopersay</title><meta name="description" content="Calculate percentages, percentage change and reverse percentages online for free."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Percentage Calculator</h1><p>Calculate percentage of a number, percentage change and reverse percentage.</p></section><section class="card"><div class="row"><div class="field"><label>X</label><input id="x" type="number" value="20"></div><div class="field"><label>Y</label><input id="y" type="number" value="200"></div></div><button class="btn" onclick="calc()">Calculate</button><div id="out" class="answer"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function calc(){let X=+x.value,Y=+y.value;out.textContent=`${X}% of ${Y} = ${(X*Y/100).toFixed(2)}\n${X} is ${Y?((X/Y)*100).toFixed(2):'—'}% of ${Y}\nChange from ${X} to ${Y}: ${X?(((Y-X)/X)*100).toFixed(2):'—'}%`}</script></body></html>
