<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Password Generator | Kopersay</title><meta name="description" content="Generate strong random passwords with custom length and character options."><link rel="stylesheet" href="style.css"><style>.password{font-size:20px;word-break:break-all;padding:18px;border-radius:14px;background:#fff8}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Password Generator</h1><p>Create strong random passwords locally in your browser.</p></section><section class="card"><div class="field"><label>Password length <b id="lv">16</b></label><input id="len" type="range" min="6" max="64" value="16"></div><div class="checks"><label><input id="up" type="checkbox" checked> Uppercase</label><label><input id="lo" type="checkbox" checked> Lowercase</label><label><input id="nu" type="checkbox" checked> Numbers</label><label><input id="sy" type="checkbox" checked> Symbols</label></div><div id="out" class="password" style="margin-top:16px">Click Generate</div><button class="btn" onclick="gen()">Generate Password</button><button class="btn" onclick="copy()" style="margin-left:8px">Copy</button><div id="msg" class="answer"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>len.oninput=()=>lv.textContent=len.value;function gen(){let s=(up.checked?'ABCDEFGHIJKLMNOPQRSTUVWXYZ':'')+(lo.checked?'abcdefghijklmnopqrstuvwxyz':'')+(nu.checked?'0123456789':'')+(sy.checked?'!@#$%^&*_-+=?':'');if(!s)return msg.textContent='Select at least one character set.';let a=new Uint32Array(+len.value);crypto.getRandomValues(a);out.textContent=[...a].map(n=>s[n%s.length]).join('');msg.textContent='New password generated locally.'}function copy(){navigator.clipboard?.writeText(out.textContent);msg.textContent='Password copied.'}gen()</script></body></html>
