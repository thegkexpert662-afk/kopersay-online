<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Word Counter Online | Kopersay</title><meta name="description" content="Count words characters sentences paragraphs reading time and keyword frequency online."><link rel="stylesheet" href="style.css"><style>.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px}.metric{padding:15px;border-radius:14px;background:#fff8;text-align:center}.metric b{display:block;font-size:23px}@media(max-width:650px){.metrics{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced Word Counter</h1><p>Analyze words, characters, sentences, paragraphs and reading time live.</p></section><section class="card"><textarea id="t" style="min-height:300px;width:100%;padding:16px;border:1px solid #fff;border-radius:14px;font:inherit" placeholder="Type or paste your text..."></textarea><div class="metrics"><div class="metric">Words<b id="w">0</b></div><div class="metric">Characters<b id="c">0</b></div><div class="metric">No spaces<b id="ns">0</b></div><div class="metric">Sentences<b id="s">0</b></div><div class="metric">Paragraphs<b id="p">0</b></div><div class="metric">Reading<b id="r">0 min</b></div></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>t.oninput=()=>{let x=t.value,words=x.trim()?x.trim().split(/\s+/):[];w.textContent=words.length;c.textContent=x.length;ns.textContent=x.replace(/\s/g,'').length;s.textContent=(x.match(/[.!?]+/g)||[]).length;p.textContent=x.trim()?(x.split(/\n\s*\n/).filter(Boolean).length):0;r.textContent=Math.max(0,Math.ceil(words.length/200))+' min'};t.oninput()</script></body></html>
