<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Word Counter Online | Kopersay</title><meta name="description" content="Count words characters sentences paragraphs and reading time online."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Word Counter</h1><p>Count words, characters, sentences and reading time.</p></section><section class="card"><textarea id="t" style="min-height:260px" placeholder="Type or paste text..."></textarea><div id="out" class="answer"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>t.oninput=()=>{let s=t.value,w=s.trim()?s.trim().split(/\s+/).length:0,c=s.length,nos=s.replace(/\s/g,'').length,se=(s.match(/[.!?]+/g)||[]).length,p=(s.match(/\n\s*\n/g)||[]).length+(s.trim()?1:0);out.textContent=`Words: ${w}\nCharacters: ${c}\nCharacters without spaces: ${nos}\nSentences: ${se}\nParagraphs: ${p}\nReading time: ${Math.ceil(w/200)} min`};t.oninput()</script></body></html>
