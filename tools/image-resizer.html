<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced Image Resizer Online Free | Kopersay</title><meta name="description" content="Resize JPG PNG and WebP images online with custom dimensions, aspect ratio lock, quality and output format controls."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="../index.html">Main Resizer</a></header><section class="hero"><h1>Image Resizer</h1><p>Resize images with custom dimensions and keep the aspect ratio.</p></section><section class="card"><div class="field"><label>Choose image</label><input id="f" type="file" accept="image/*"></div><div class="row"><div class="field"><label>Width</label><input id="w" type="number"></div><div class="field"><label>Height</label><input id="h" type="number"></div></div><label><input id="lock" type="checkbox" checked> Lock aspect ratio</label><div class="field"><label>Format</label><select id="fmt"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><div class="field"><label>Quality</label><input id="q" type="range" min="10" max="100" value="90"></div><button class="btn" onclick="go()">Resize & Download</button><div id="out" class="answer">Select an image.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let im=new Image,ratio=1;f.onchange=()=>{let u=URL.createObjectURL(f.files[0]);im.onload=()=>{w.value=im.width;h.value=im.height;ratio=im.width/im.height};im.src=u};w.oninput=()=>{if(lock.checked)h.value=Math.round(+w.value/ratio)};h.oninput=()=>{if(lock.checked)w.value=Math.round(+h.value*ratio)};function go(){if(!im.naturalWidth)return out.textContent='Select an image.';let c=document.createElement('canvas');c.width=+w.value;c.height=+h.value;c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{let ext=fmt.value.split('/')[1],a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kopersay-resized.'+ext;a.click();out.textContent=`Output: ${c.width} × ${c.height} px`},fmt.value,+q.value/100)}</script></body></html>
