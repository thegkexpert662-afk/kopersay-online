<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Advanced Image Resizer Online | Resize JPG PNG WebP - Kopersay</title><meta name="description" content="Advanced free image resizer by Kopersay. Resize JPG, PNG and WebP images with aspect ratio lock, presets, quality control, format selection, preview and instant browser download."><link rel="stylesheet" href="style.css"><style>.drop{cursor:pointer;text-align:center}.drop input{width:100%;margin-top:10px}.drop.drag{border-color:#635bff;transform:scale(1.01)}.check{display:flex;align-items:center;gap:8px;margin:12px 0;font-weight:600}.check input{width:auto}.select{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(80,100,180,.2);background:rgba(255,255,255,.75);font:inherit}.range-line{display:flex;align-items:center;gap:12px}.range-line input{flex:1}.range-value{min-width:48px;text-align:right;font-weight:700}.preset-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.preset-grid button{border:1px solid rgba(80,100,180,.2);background:rgba(255,255,255,.72);border-radius:10px;padding:8px 11px;cursor:pointer;font-weight:600}.preset-grid button:hover{transform:translateY(-1px)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{padding:12px;border-radius:14px;background:rgba(255,255,255,.55);text-align:center}.stat small{display:block;opacity:.7;margin-bottom:4px}.stat strong{font-size:14px}@media(max-width:650px){.stats{grid-template-columns:1fr}.preset-grid{gap:6px}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay Technologies"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Free Advanced Image Resizer Online</h1><p>Resize JPG, PNG and WebP images with smart controls, presets, quality settings and live preview.</p></section><section class="card"><div class="field drop" id="drop"><label for="file">Choose or drop an image</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/*"><div class="note">JPG, PNG, WebP • processed privately in your browser</div></div><div id="originalStats" class="stats" hidden><div class="stat"><small>Original</small><strong id="origDim">—</strong></div><div class="stat"><small>File size</small><strong id="origSize">—</strong></div><div class="stat"><small>Type</small><strong id="origType">—</strong></div></div><div class="row"><div class="field"><label for="w">Width (px)</label><input id="w" type="number" min="1" max="10000" placeholder="1920"></div><div class="field"><label for="h">Height (px)</label><input id="h" type="number" min="1" max="10000" placeholder="1080"></div></div><label class="check"><input id="lock" type="checkbox" checked> Lock aspect ratio</label><div class="field"><label>Quick presets</label><div class="preset-grid"><button type="button" data-size="1920x1080">Full HD</button><button type="button" data-size="1280x720">HD</button><button type="button" data-size="1080x1080">Square</button><button type="button" data-size="1080x1350">Portrait</button><button type="button" data-size="1080x1920">Story</button><button type="button" data-size="1200x630">Social</button></div></div><div class="row"><div class="field"><label for="format">Output format</label><select id="format" class="select"><option value="image/jpeg">JPG</option><option value="image/png">PNG</option><option value="image/webp">WebP</option></select></div><div class="field"><label for="quality">Quality <span id="qualityText">90%</span></label><div class="range-line"><input id="quality" type="range" min="10" max="100" value="90"><span class="range-value" id="qualityValue">90%</span></div></div></div><div class="tools"><button class="btn" id="go">Resize & Download</button><button class="btn" id="reset" type="button">Reset</button></div><img id="preview" class="preview" alt="Selected image preview" hidden><div id="out" class="result">Select an image to begin.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>const file=document.getElementById('file'),drop=document.getElementById('drop'),w=document.getElementById('w'),h=document.getElementById('h'),lock=document.getElementById('lock'),format=document.getElementById('format'),quality=document.getElementById('quality'),qualityText=document.getElementById('qualityText'),qualityValue=document.getElementById('qualityValue'),preview=document.getElementById('preview'),out=document.getElementById('out'),go=document.getElementById('go'),reset=document.getElementById('reset'),origStats=document.getElementById('originalStats'),origDim=document.getElementById('origDim'),origSize=document.getElementById('origSize'),origType=document.getElementById('origType');let selected=null,img=new Image(),ratio=1;const sizeText=b=>b<1024?(b+' B'):(b<1048576?(b/1024).toFixed(1)+' KB':(b/1048576).toFixed(2)+' MB');const setFile=f=>{if(!f||!f.type.startsWith('image/')){out.textContent='Please choose a valid image file.';return}selected=f;const url=URL.createObjectURL(f);img.onload=()=>{w.value=img.naturalWidth;h.value=img.naturalHeight;ratio=img.naturalWidth/img.naturalHeight;preview.src=url;preview.hidden=false;origStats.hidden=false;origDim.textContent=img.naturalWidth+' × '+img.naturalHeight+' px';origSize.textContent=sizeText(f.size);origType.textContent=f.type.split('/')[1].toUpperCase();out.textContent='Ready. Adjust the size and settings, then download.'};img.src=url};file.addEventListener('change',e=>setFile(e.target.files[0]));['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>setFile(e.dataTransfer.files[0]));w.addEventListener('input',()=>{if(lock.checked&&ratio){h.value=Math.max(1,Math.round(+w.value/ratio))}});h.addEventListener('input',()=>{if(lock.checked&&ratio){w.value=Math.max(1,Math.round(+h.value*ratio))}});quality.addEventListener('input',()=>{qualityText.textContent=quality.value+'%';qualityValue.textContent=quality.value+'%'});document.querySelectorAll('[data-size]').forEach(b=>b.addEventListener('click',()=>{const [W,H]=b.dataset.size.split('x').map(Number);lock.checked=false;w.value=W;h.value=H}));go.addEventListener('click',()=>{if(!selected||!img.naturalWidth){out.textContent='Please choose an image first.';return}const W=Number(w.value),H=Number(h.value);if(!W||!H||W<1||H<1||W>10000||H>10000){out.textContent='Enter a valid width and height (1–10,000 px).';return}const canvas=document.createElement('canvas');canvas.width=W;canvas.height=H;const ctx=canvas.getContext('2d',{alpha:true});ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';if(format.value==='image/jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H)}ctx.drawImage(img,0,0,W,H);const ext=format.value==='image/png'?'png':format.value==='image/webp'?'webp':'jpg';canvas.toBlob(blob=>{if(!blob){out.textContent='This format could not be created in your browser.';return}const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='kopersay-resized-'+W+'x'+H+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);out.textContent='Done: '+W+' × '+H+' px • '+sizeText(blob.size)+' • '+ext.toUpperCase();},format.value,Number(quality.value)/100)});reset.addEventListener('click',()=>{file.value='';selected=null;preview.hidden=true;origStats.hidden=true;w.value='';h.value='';out.textContent='Select an image to begin.'});</script></body></html>
