<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Image Resizer Online | Resize JPG PNG WebP - Kopersay</title><meta name="description" content="Resize JPG, PNG and WebP images online for free. Set custom width and height and download your resized image in seconds."><link rel="stylesheet" href="style.css"></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay Technologies"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Free Image Resizer Online</h1><p>Resize JPG, PNG and WebP images to custom dimensions directly in your browser.</p></section><section class="card"><div class="field"><label>Choose image</label><input id="file" type="file" accept="image/*"></div><div class="row"><div class="field"><label>Width (px)</label><input id="w" type="number" placeholder="1920"></div><div class="field"><label>Height (px)</label><input id="h" type="number" placeholder="1080"></div></div><div class="tools"><button class="btn" id="go">Resize & Download</button></div><img id="preview" class="preview" alt="Preview"><div id="out" class="result">Select an image to begin.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let f,im=new Image;file.onchange=e=>{f=e.target.files[0];if(!f)return;im.onload=()=>{preview.src=im.src;w.value=im.naturalWidth;h.value=im.naturalHeight};im.src=URL.createObjectURL(f)};go.onclick=()=>{if(!f)return out.textContent='Please choose an image first.';let W=+w.value,H=+h.value,c=document.createElement('canvas');c.width=W;c.height=H;c.getContext('2d').drawImage(im,0,0,W,H);c.toBlob(b=>{let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kopersay-resized.jpg';a.click();out.textContent=`Done: ${W} × ${H}px`},'image/jpeg',.9)}</script></body></html>
