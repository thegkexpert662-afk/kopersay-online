<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced QR Code Generator Online Free | Custom QR Codes - Kopersay</title><meta name="description" content="Create custom QR codes online for free from text, URLs, email, phone and Wi-Fi details. Choose size, colors and download your QR code with Kopersay."><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.box{padding:18px;border-radius:16px;background:rgba(255,255,255,.55)}.preview{min-height:280px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px}.preview #qr{background:#fff;padding:14px;border-radius:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}.mini{font-size:.9rem;opacity:.75}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg" alt="Kopersay Technologies"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced QR Code Generator</h1><p>Create customizable QR codes for URLs, text, email, phone and Wi-Fi.</p></section><section class="card"><div class="grid"><div class="box"><div class="field"><label>QR Type</label><select id="type"><option value="text">Text / URL</option><option value="email">Email</option><option value="phone">Phone</option><option value="wifi">Wi-Fi</option></select></div><div id="textFields"><div class="field"><label>Text or URL</label><input id="text" placeholder="https://kopersay.online"></div></div><div id="emailFields" class="hidden"><div class="field"><label>Email address</label><input id="email"></div><div class="field"><label>Subject</label><input id="subject"></div><div class="field"><label>Message</label><textarea id="message"></textarea></div></div><div id="phoneFields" class="hidden"><div class="field"><label>Phone number</label><input id="phone" type="tel" placeholder="+91 9876543210"></div></div><div id="wifiFields" class="hidden"><div class="field"><label>Wi-Fi name (SSID)</label><input id="ssid"></div><div class="field"><label>Password</label><input id="wifiPass" type="password"></div><div class="field"><label>Security</label><select id="security"><option>WPA</option><option>WEP</option><option value="nopass">No password</option></select></div></div><div class="field"><label>Size: <span id="sizeLabel">260</span> px</label><input id="size" type="range" min="160" max="600" value="260"></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div class="field"><label>Dark color</label><input id="dark" type="color" value="#111111"></div><div class="field"><label>Light color</label><input id="light" type="color" value="#ffffff"></div></div><div class="actions"><button class="btn" id="go">Generate QR Code</button><button class="btn" id="clear" type="button">Clear</button></div><p class="mini">QR generation happens in your browser. Avoid putting sensitive information into a QR code you plan to share publicly.</p></div><div class="box preview"><h2>Preview</h2><div id="qr"></div><button class="btn" id="download" type="button">Download PNG</button></div></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>const $=id=>document.getElementById(id);function esc(s){return String(s).replace(/([\\;,:])/g,'\\$1')}function payload(){const type=$('type').value;if(type==='email')return `mailto:${$('email').value}?subject=${encodeURIComponent($('subject').value)}&body=${encodeURIComponent($('message').value)}`;if(type==='phone')return `tel:${$('phone').value}`;if(type==='wifi')return `WIFI:T:${$('security').value};S:${esc($('ssid').value)};P:${esc($('wifiPass').value)};;`;return $('text').value.trim()||'https://kopersay.online'}function showFields(){['textFields','emailFields','phoneFields','wifiFields'].forEach(id=>$(id).classList.add('hidden'));const map={text:'textFields',email:'emailFields',phone:'phoneFields',wifi:'wifiFields'};$(map[$('type').value]).classList.remove('hidden')}function generate(){const box=$('qr');box.innerHTML='';const size=+$('size').value;new QRCode(box,{text:payload(),width:size,height:size,colorDark:$('dark').value,colorLight:$('light').value,correctLevel:QRCode.CorrectLevel.M});$('sizeLabel').textContent=size}function download(){const canvas=$('qr').querySelector('canvas');const img=$('qr').querySelector('img');if(!canvas&&!img)return;const a=document.createElement('a');a.download='kopersay-qr-code.png';a.href=canvas?canvas.toDataURL('image/png'):img.src;a.click()}$('type').onchange=showFields;$('size').oninput=()=>{$('sizeLabel').textContent=$('size').value};$('go').onclick=generate;$('download').onclick=download;$('clear').onclick=()=>{$('text').value='';$('email').value='';$('subject').value='';$('message').value='';$('phone').value='';$('ssid').value='';$('wifiPass').value='';$('qr').innerHTML=''};showFields();generate();</script></body></html>
