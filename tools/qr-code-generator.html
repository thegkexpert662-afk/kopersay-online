<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced QR Code Generator Online | Kopersay</title><meta name="description" content="Create downloadable QR codes for URLs text email and phone numbers with custom size."><link rel="stylesheet" href="style.css"><style>.qrbox{text-align:center;padding:24px;background:#fff8;border-radius:18px}.qrbox img{max-width:280px;width:100%;background:white;padding:12px;border-radius:12px}</style></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced QR Code Generator</h1><p>Generate a QR code from text, URL, email or phone number.</p></section><section class="card"><div class="field"><label>Content type</label><select id="type"><option>URL / Text</option><option>Email</option><option>Phone</option></select></div><div class="field"><label>Content</label><textarea id="txt" rows="5" placeholder="https://kopersay.online/"></textarea></div><div class="row"><div class="field"><label>Size</label><select id="size"><option>256</option><option selected>512</option><option>1024</option></select></div><div class="field"><label>Margin</label><input id="margin" type="number" value="2" min="0" max="10"></div></div><button class="btn" onclick="make()">Generate QR Code</button><div id="out" class="qrbox" style="margin-top:16px">Your QR code will appear here.</div></section><footer>© 2026 Kopersay Technologies</footer></div><script>function make(){let v=txt.value.trim();if(!v)return out.textContent='Enter content first.';if(type.value==='Email')v='mailto:'+v;if(type.value==='Phone')v='tel:'+v;let s=size.value,m=margin.value,url='https://api.qrserver.com/v1/create-qr-code/?size='+s+'x'+s+'&margin='+m+'&data='+encodeURIComponent(v);out.innerHTML=`<img src="${url}" alt="Generated QR code"><br><a class="btn" style="display:inline-block;margin-top:12px" href="${url}" download="kopersay-qr.png">Download QR</a>`}</script></body></html>
