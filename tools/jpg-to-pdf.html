<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Advanced JPG to PDF Converter | Kopersay</title><meta name="description" content="Convert multiple JPG PNG images to a PDF online with page size orientation and quality options."><link rel="stylesheet" href="style.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script></head><body><div class="wrap"><header class="top"><img src="../logo.svg"><div class="brand">Kopersay <span>Online</span></div><a class="back" href="index.html">All Tools</a></header><section class="hero"><h1>Advanced JPG to PDF</h1><p>Combine multiple images into one professional PDF.</p></section><section class="card"><div class="field"><label>Select images</label><input id="f" type="file" accept="image/*" multiple></div><div class="row"><div class="field"><label>Page size</label><select id="ps"><option>A4</option><option>Letter</option><option>Auto</option></select></div><div class="field"><label>Orientation</label><select id="or"><option value="p">Portrait</option><option value="l">Landscape</option></select></div></div><div class="field"><label>Image quality <b id="qv">90%</b></label><input id="q" type="range" min="40" max="100" value="90"></div><div id="list" class="answer">No images selected.</div><button class="btn" onclick="make()">Create & Download PDF</button><div id="out" class="answer"></div></section><footer>© 2026 Kopersay Technologies</footer></div><script>let files=[];q.oninput=()=>qv.textContent=q.value+'%';f.onchange=()=>{files=[...f.files];list.textContent=files.length?files.map((x,i)=>`${i+1}. ${x.name}`).join('\n'):'No images selected.'};async function make(){if(!files.length)return out.textContent='Select at least one image.';let {jsPDF}=window.jspdf;let doc,first=true;for(let file of files){let u=URL.createObjectURL(file),im=await new Promise(r=>{let i=new Image;i.onload=()=>r(i);i.src=u});let w=im.width,h=im.height,land=or.value==='l';if(ps.value==='Auto'){let unit='px';doc=new jsPDF({orientation:w>h?'l':'p',unit,format:[w,h]})}else{doc=first?new jsPDF({orientation:land?'l':'p',unit:'mm',format:ps.value.toLowerCase()}):doc;let pw=land?297:210,ph=land?210:297,scale=Math.min((pw-20)/w,(ph-20)/h),iw=w*scale,ih=h*scale;doc.addImage(im,'JPEG',(pw-iw)/2,(ph-ih)/2,iw,ih,undefined,'FAST')}if(!first)doc.addPage();first=false;URL.revokeObjectURL(u)}doc.save('kopersay-images.pdf');out.textContent=`PDF created successfully • ${files.length} page(s)`}</script></body></html>
